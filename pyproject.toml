[build-system]
build-backend = "cmeel"
requires = [
  "cmeel[build]",
  # cmeel names the wheel after the first tag of packaging's sys_tags(). Since packaging 26.3,
  # that first tag is the bare "linux_x86_64" instead of "manylinux_2_28_x86_64", and PyPI
  # rejects wheels tagged that way
  "packaging < 26.3",
  "eiquadprog >= 1.2.6, < 2",
  "pin[build]==3.8.0",
  "rhoban-cmeel-jsoncpp",
  "doxystub >= 0.1.7",
  "cmeel-urdfdom==4.0.1",
  "cmeel-tinyxml2==10.0.0",
  "cmake<4"
]

[project]
authors = [{ email = "team@rhoban.com", name = "Rhoban team" }]
classifiers = []
dependencies = [
  "eiquadprog >= 1.2.6, < 2",
  "pin==3.8.0",
  "rhoban-cmeel-jsoncpp",
  "cmeel-urdfdom==4.0.1",
  "cmeel-tinyxml2==10.0.0",
  "meshcat",
  "ischedule"
]
description = "PlaCo: Rhoban Planning and Control"
license = "MIT"
name = "placo"
requires-python = ">= 3.10"
version = "0.9.24"

[project.urls]
changelog = "https://github.com/rhoban/placo/blob/main/CHANGELOG.md"
homepage = "https://placo.readthedocs.io/en/latest/"
repository = "https://github.com/rhoban/placo.git"

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py39"

[tool.tomlsort]
all = true

[tool.cmeel]
run-tests = false


[tool.cibuildwheel.macos]
before-all = "brew install --formula doxygen"

[tool.cibuildwheel.linux]
before-all = "yum install -y doxygen"

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = "apk add doxygen"

